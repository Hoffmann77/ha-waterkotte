- theme: Backend-selected
  path: wkh
  icon: mdi:radiator
  badges: []
  cards:
    - type: entities
      entities:
        - entity: select.waterkotte_operation_mode_cooling
          name: Betrieb Kühlung
        - entity: select.waterkotte_operation_mode_heating
          name: Betrieb Heizung
        - entity: select.waterkotte_operation_mode_hot_water
          name: Betrieb Warmwasser
        - entity: switch.waterkotte_holiday
          name: Urlaubsfunktion
        - entity: sensor.waterkotte_holiday_start
          name: Urlaub beginnt am
        - entity: sensor.waterkotte_holiday_end
          name: Endet am
      title: Waterkotte
      show_header_toggle: false
      state_color: true
    - type: vertical-stack
      cards:
        - type: entities
          title: Status
          icon: mdi:list-status
          entities:
            - entity: binary_sensor.waterkotte_compressor
              name: Verdichter
            - entity: binary_sensor.waterkotte_heat_pump
              name: Wärmepumpe
            - entity: binary_sensor.waterkotte_source_pump
              name: Quellpumpe
            - entity: binary_sensor.waterkotte_evd
              name: Überhitzungsregler
            - entity: binary_sensor.waterkotte_electrical_heater
              name: Heizstab
            - entity: binary_sensor.waterkotte_compressor_ii
              name: Verdichter II
            - entity: binary_sensor.waterkotte_hot_water
              name: Warmwasser
            - entity: binary_sensor.waterkotte_heating_mode
              name: Heizung
            - entity: binary_sensor.waterkotte_cooling_mode
              name: Kühlung
            - entity: binary_sensor.waterkotte_hot_water_mode
              name: Warmwasser
            - entity: sensor.waterkotte_service_data
              name: Service?
          show_header_toggle: false
          state_color: true
        - type: entities
          title: Temperaturen
          icon: mdi:thermometer
          entities:
            - entity: sensor.waterkotte_outdoor_temperature
              name: Außen
            - entity: sensor.waterkotte_actual_temperature_heating
              name: Heizung
            - entity: sensor.waterkotte_actual_temperature_mixer_1
              name: Mischerkreis 1
            - entity: sensor.waterkotte_hot_water_temperature
              name: Warmwasser
            - entity: sensor.waterkotte_temperature_buffer_tank
              name: Speicher
          show_header_toggle: false
          state_color: true
        - type: entities
          title: Leistung
          icon: mdi:lightning-bolt
          entities:
            - entity: sensor.waterkotte_electrical_power
              name: Leistungsaufnahme
            - entity: sensor.waterkotte_cop
              name: COP
            - entity: sensor.waterkotte_thermal_power
              name: Thermische Leistung
            - entity: sensor.waterkotte_cop_cooling_power
              name: COP Kälteleistung
            - entity: sensor.waterkotte_cooling_power
              name: Kälteleistung
          show_header_toggle: false
          state_color: true
    - type: entities
      title: Heizung
      icon: mdi:radiator
      show_header_toggle: false
      state_color: true
      entities:
        - entity: select.waterkotte_heating_control
        - entity: number.waterkotte_heating_temperature
          name: Heiztemperatur [manuell]
        - entity: number.waterkotte_temperature_adjustment_heating
          name: Anpassung
          icon: mdi:plus-minus-variant
        - entity: sensor.waterkotte_actual_temperature_heating
          name: Istwert
          icon: mdi:thermometer
        - entity: sensor.waterkotte_demanded_temperature_heating
          name: Sollwert
          icon: mdi:thermometer
        - entity: number.waterkotte_hysteresis_setpoint_heating
          name: Schaltdifferenz Sollwert
          icon: mdi:delta
        - entity: number.waterkotte_t_heating_limit_heating
          name: Heizgrenze
        - entity: number.waterkotte_t_heating_limit_target_heating
          name: Heizgrenze Soll
        - entity: number.waterkotte_t_norm_outdoor_heating
          name: Norm-Außen
        - entity: number.waterkotte_t_norm_heating_circle_heating
          name: Heizkreis Norm
    - type: entities
      title: Mischerkreis 1
      icon: mdi:numeric-1-circle
      entities:
        - entity: number.waterkotte_temperature_adjustment_mixer_1
          name: Anpassung
          icon: mdi:plus-minus-variant
        - entity: sensor.waterkotte_actual_temperature_mixer_1
          name: Istwert
          icon: mdi:thermometer
        - entity: sensor.waterkotte_demanded_temperature_mixer_1
          name: Sollwert
          icon: mdi:thermometer
        - entity: number.waterkotte_t_heating_limit_mixer_1
          name: Heizgrenze
        - entity: number.waterkotte_t_heating_limit_target_mixer_1
          name: Heizgrenze Soll
        - entity: number.waterkotte_t_norm_outdoor_mixer_1
          name: Norm-Außen
        - entity: number.waterkotte_t_norm_heating_circle_mixer_1
          name: Heizkreis Norm
    - type: vertical-stack
      cards:
        - type: entities
          state_color: true
          title: Warmwasser
          show_header_toggle: false
          icon: mdi:water-thermometer
          entities:
            - entity: sensor.waterkotte_hot_water_temperature
              name: Istwert
              icon: mdi:thermometer
            - entity: number.waterkotte_demanded_temperature_hot_water
              name: Sollwert
              icon: mdi:thermometer
            - entity: number.waterkotte_hysteresis_setpoint_hot_water
              name: Schaltdifferenz Sollwert
              icon: mdi:delta
        - type: entities
          state_color: true
          title: Desinfektion
          show_header_toggle: false
          icon: mdi:shield-bug
          entities:
            - entity: number.waterkotte_demanded_temperature_disinfection
              name: Temperatur
              icon: mdi:thermometer
            - entity: sensor.waterkotte_start_time_disinfection
              name: Startzeit
            - entity: number.waterkotte_max_runtime_disinfection
              name: Dauer (in Stunden)
            - type: custom:multiple-entity-row
              entity: switch.waterkotte_sunday_disinfection
              state_header: So
              toggle: true
              state_color: true
              entities:
                - entity: switch.waterkotte_monday_disinfection
                  name: Mo
                  toggle: true
                  state_color: true
                - entity: switch.waterkotte_tuesday_disinfection
                  name: Di
                  toggle: true
                  state_color: true
                - entity: switch.waterkotte_wednesday_disinfection
                  name: Mi
                  toggle: true
                  state_color: true
                - entity: switch.waterkotte_thursday_disinfection
                  name: Do
                  toggle: true
                  state_color: true
                - entity: switch.waterkotte_friday_disinfection
                  name: Fr
                  toggle: true
                  state_color: true
                - entity: switch.waterkotte_saturday_disinfection
                  name: Sa
                  toggle: true
                  state_color: true
    - type: entities
      title: Details
      entities:
        - entity: sensor.waterkotte_power_compressor
          name: Leistung Verdichter
        - entity: sensor.waterkotte_speed_heating_pump
          name: Drehzahl Heizungspumpe
        - entity: sensor.waterkotte_speed_source_pump
          name: Drehzahl Quellenpumpe
        - entity: sensor.waterkotte_valve_opening_eev
          name: EEV Ventilöffnung
        - entity: sensor.waterkotte_suction_gas_overheating
          name: Sauggas Überhitzung
        - entity: sensor.waterkotte_p_condensation
          name: Druck Kondensator
        - entity: sensor.waterkotte_t_condensation
          name: Temp. Kondensator
        - entity: sensor.waterkotte_p_evaporation
          name: Druck Verdampfer
        - entity: sensor.waterkotte_t_evaporation
          name: Temp. Verdampfer
        - entity: sensor.waterkotte_t_flow
          name: Temp. Vorlauf
        - entity: sensor.waterkotte_t_return
          name: Temp. Rücklauf
        - entity: sensor.waterkotte_t_source_entry
          name: Temp. Quelle Eingang
        - entity: sensor.waterkotte_t_source_exit
          name: Temp. Quelle Ausgang
        - entity: sensor.waterkotte_t_suction_line
          name: Temp. Saugleitung